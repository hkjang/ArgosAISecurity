# Argos Agent 설정 예시.
# 이 파일을 프로젝트 루트(또는 /etc/argos/)에 argos.toml로 복사해 사용한다.

# 감시 대상 경로 (재귀)
watch_paths = ["./watched"]

# 로컬 이벤트/탐지 저장소
db_path = "./argos-data/argos.db"

# 센서 백엔드: "notify" (기본, 크로스 플랫폼, pid 없음)
#             "fanotify" (Linux 전용, root 필요, 원인 pid 제공)
sensor = "notify"

[detection]
# 행위 점수 슬라이딩 윈도우(초)
window_secs = 10
# 윈도우 내 이 개수 이상 파일 변경 시 대량 변경으로 가중
mass_change_threshold = 30
# 윈도우 내 변경 파일이 이 개수 미만이면 탐지하지 않음 (단일 파일 오탐 방지)
min_changed_files = 5
# 이 값 이상의 엔트로피는 암호화 의심 (0.0 ~ 8.0, 암호화 데이터는 보통 7.2+)
entropy_threshold = 7.2
# Detection 생성 최소 점수 (0 ~ 100)
detect_score = 40.0
# 엔트로피 샘플링 크기(바이트)
entropy_sample_bytes = 65536
# 오탐 방지: 점수 계산 제외 경로 (백업, 로그 로테이션, DB dump 등)
exclude_paths = []

# 저속·분산 변경 집계는 명시적으로 활성화한다. 아래 블록의 주석을 해제할 때
# protected_paths를 실제 절대 경로로 지정한다. 집계만으로 현재 PID를 종료하지 않는다.
# [detection.multi_window]
# enabled = true
# protected_paths = ["/srv/data"]
# aggregate_by_user = true
# aggregate_by_ancestry = true
# max_events = 10000
# max_groups = 2048
# max_path_bytes = 4096
# windows = [
#   { window_secs = 10, min_changed_files = 5, mass_change_threshold = 30, detect_score = 65.0 },
#   { window_secs = 60, min_changed_files = 8, mass_change_threshold = 40, detect_score = 65.0 },
#   { window_secs = 600, min_changed_files = 12, mass_change_threshold = 60, detect_score = 65.0 },
# ]
# 승인 작업에서 집계를 조정할 때는 behavior.multi_window.instance / user_path /
# protected_path / ancestor를 각각 전체 이름으로 adjusted_rules에 명시한다.

# 앞·중간·끝을 합친 총 읽기 예산이다. 기존 앞부분 읽기에 추가하지 않는다.
# 이전 관찰과의 엔트로피 차이는 정상본 판정이 아니며 미관측 구간은 남는다.
# [detection.content_sampling]
# enabled = true
# total_bytes = 65536
# max_files = 2048
# history_secs = 600
# min_entropy_increase = 1.0

[response]
# true: 차단 점수 초과 시 프로세스 자동 종료 (Linux 전용)
# false: 탐지·로그만 (권장 초기값 — 요건서 18. 단계적 차단)
auto_block = false
block_score = 80.0

[backup]
# 변경 파일을 내용 주소(SHA-256) 저장소에 버전으로 보관 — argos restore의 복구 지점
enabled = true
# 백업 디렉터리. 반드시 감시 경로(watch_paths) 밖에 둘 것.
dir = "./argos-data/backup"
# 이 크기를 넘는 파일은 백업하지 않음 (bytes)
max_file_bytes = 52428800
# 경로당 미검토 버전 보존 수 (정상 판정 버전은 명시적 취소 전 보존)
keep_versions = 5
# 에이전트 시작 시 기존 파일 1회 베이스라인 백업
baseline_on_start = true
# baseline은 자동으로 정상본이 되지 않는다. restore --mark-good으로 검토 근거를 남긴다.
queue_capacity = 256
# 한 파일 크기의 burst를 허용하는 평균 처리 예산 (bytes/sec)
io_bytes_per_sec = 10485760

[policy]
# 비어 있으면 로컬 탐지/대응 설정 사용. 설정한 정책 검증 실패 시 시작을 중단한다.
# 키 생성/서명: argos policy gen-key / argos policy sign policy.toml --key-file <비밀키 파일>
# 운영 활성화에는 아래 ID/대상/신뢰 키 및 정책 메타데이터가 필수다.
# 사용법·이전 형식 마이그레이션: docs/FEATURE_POLICY.md
path = ""
policy_id = ""
host_id = ""
groups = []
# 기본 상태: <db_path>.policy-state/state.sqlite3 (전용 디렉터리 0700, 파일 0600)
# state_path = "/var/lib/argos/policy-state/state.sqlite3"
# 이전 pubkey는 CLI 서명 확인만 지원하며 운영 활성화에는 사용하지 않는다.
# pubkey = "<이전 공개키 hex 64자>"

[policy.trusted_keys]
# release-2026 = "<Ed25519 공개키 hex 64자>"

[process_monitor]
# 프로세스 실행 감시 (/proc 폴링, Linux 전용)
enabled = true
interval_ms = 1000

[central]
# 중앙관리 서버 URL. 비우면 standalone 모드.
# 예: url = "http://central.example.com:8420"
url = ""
# Bearer 개별 에이전트 토큰 (중앙 --agent-tokens 파일의 해당 agent_id 값)
token = ""
# 비우면 hostname 사용
agent_id = ""

[ai]
# 온프레미스: provider = "ollama", endpoint = "http://127.0.0.1:11434/api/chat"
provider = "anthropic"
endpoint = ""
# 실제 사용할 모델 ID 또는 ARGOS_AI_MODEL 환경변수 (자동 선택 없음)
model = ""
# 비어 있으면 anthropic만 ANTHROPIC_API_KEY 사용. ollama는 인증키 전송 없음.
api_key_env = ""
timeout_secs = 60
# 각 이벤트 종류별 근거 상한; 초과 건수는 AI 입력·CLI에 명시
evidence_limit = 200

[semantic]
# 지원하는 Linux 설정 파일을 절대 경로로 명시. watch_paths에도 포함해야 한다.
# 예: files = ["/etc/sudoers", "/etc/systemd/system/example.service"]
files = []
max_file_bytes = 262144
