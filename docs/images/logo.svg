<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Glow filter for tech accents -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield (Very Soft / Stylized Outline) -->
  <path d="M100,15 L170,42 C170,118 135,160 100,185 C65,160 30,118 30,42 Z" 
        fill="none" 
        stroke="#e2e8f0" 
        stroke-width="3" 
        stroke-dasharray="6 4" 
        opacity="0.8" />

  <!-- Dog Head Base -->
  <!-- Left Ear (Shield Shape) -->
  <path d="M55,60 C40,60 25,85 35,115 C45,135 65,120 65,95 Z" 
        fill="#334155" />
  <path d="M52,65 C42,65 32,85 40,108 C48,123 60,113 60,95 Z" 
        fill="#fda4af" opacity="0.6" /> <!-- Inner Ear -->

  <!-- Right Ear (Shield Shape) -->
  <path d="M145,60 C160,60 175,85 165,115 C155,135 135,120 135,95 Z" 
        fill="#334155" />
  <path d="M148,65 C158,65 168,85 160,108 C152,123 140,113 140,95 Z" 
        fill="#fda4af" opacity="0.6" /> <!-- Inner Ear -->

  <!-- Main Head Circle -->
  <circle cx="100" cy="100" r="48" fill="#475569" />

  <!-- White Muzzle -->
  <path d="M100,85 C118,85 130,97 130,112 C130,127 115,135 100,135 C85,135 70,127 70,112 C70,97 82,85 100,85 Z" 
        fill="#f8fafc" />

  <!-- Cute Nose -->
  <path d="M92,102 C92,98 108,98 108,102 C108,107 100,112 100,112 C100,112 92,107 92,102 Z" 
        fill="#0f172a" />

  <!-- Mouth -->
  <path d="M94,118 C96,121 98,122 100,122 C102,122 104,121 106,118" 
        fill="none" 
        stroke="#0f172a" 
        stroke-width="2" 
        stroke-linecap="round" />

  <!-- Big Friendly Eyes -->
  <!-- Left Eye -->
  <circle cx="78" cy="90" r="8" fill="#0f172a" />
  <circle cx="76" cy="88" r="2.5" fill="#ffffff" /> <!-- Eye Shine -->
  
  <!-- Right Eye -->
  <circle cx="122" cy="90" r="8" fill="#0f172a" />
  <circle cx="124" cy="88" r="2.5" fill="#ffffff" /> <!-- Eye Shine -->

  <!-- Cute Rosy Cheeks -->
  <circle cx="65" cy="105" r="5" fill="#fda4af" opacity="0.8" />
  <circle cx="135" cy="105" r="5" fill="#fda4af" opacity="0.8" />

  <!-- Glowing Cyan Security Collar -->
  <path d="M68,138 C80,147 120,147 132,138" 
        fill="none" 
        stroke="#06b6d4" 
        stroke-width="5" 
        stroke-linecap="round" 
        filter="url(#cyanGlow)" />

  <!-- Shield Charm (Collar Pendant) -->
  <path d="M100,144 L110,149 C110,160 105,166 100,170 C95,166 90,160 90,149 Z" 
        fill="#22d3ee" 
        filter="url(#cyanGlow)" />
</svg>
