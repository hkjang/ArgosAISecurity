<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield Outline with Gradient Glow -->
  <path d="M100,20 L160,45 C160,115 130,155 100,180 C70,155 40,115 40,45 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#glowGrad)" 
        stroke-width="4" 
        stroke-linejoin="round" />
        
  <!-- Stylized Vigilant Eye (Argos) -->
  <!-- Eye Outline (Upper & Lower Lids) -->
  <path d="M60,100 C75,70 125,70 140,100 C125,130 75,130 60,100 Z" 
        fill="none" 
        stroke="#e2e8f0" 
        stroke-width="3.5" />
        
  <!-- Outer Iris -->
  <circle cx="100" cy="100" r="22" 
          fill="none" 
          stroke="url(#glowGrad)" 
          stroke-width="3" />
          
  <!-- Pupil (AI Glow) -->
  <circle cx="100" cy="100" r="10" 
          fill="#22d3ee" 
          filter="url(#glow)" />
          
  <!-- Tech Crosshairs / Guardian Lines -->
  <path d="M100,55 L100,70 M100,130 L100,145 M55,100 L70,100 M130,100 L145,100" 
        stroke="#06b6d4" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.8" />
</svg>
